# MoonLight Hanwha 로컬 Supabase 설정
# `supabase start` / `supabase db reset` / `supabase functions serve` 에서 사용한다.
# 비밀값(SUPABASE_SECRET_KEY, OPENROUTER_API_KEY, DEMO_RESET_TOKEN)은 여기에 두지 않고
# `supabase secrets set` 또는 로컬 `supabase/.env`(gitignore) 로 주입한다.

project_id = "hanwha-ai-solution"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
# 발표 단계에서는 사진 업로드를 지원하지 않는다 (설계 §10).
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5500"
additional_redirect_urls = ["https://junyeong-nero.github.io/hanwha-ai-solution/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# 공용 QR 입장은 익명 세션을 먼저 만들어야 하므로 반드시 켠다.
# 호스팅 프로젝트에서는 Dashboard → Authentication → Providers 에서 별도로 켜야 한다.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

# 사용자 JWT를 요구하는 함수들 (기본값 유지)
[functions.verify-demo-entry]
verify_jwt = true

[functions.recommend-meetings]
verify_jwt = true

[functions.suggest-meeting-plan]
verify_jwt = true

[functions.complete-meeting]
verify_jwt = true

# reset-demo 는 사용자 JWT 대신 x-demo-reset-token 헤더로 자체 인증한다.
[functions.reset-demo]
verify_jwt = false
